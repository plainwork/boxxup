server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  # boxx health check
  location = /up { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache"; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}

# get.boxxup.com answers with the installer itself (no redirect, because plain
# `curl … | sh` doesn't follow one). The Dockerfile copies install.sh in from boxx.
server {
  listen 80;
  server_name get.*;
  root /usr/share/nginx/html;

  location = /up { access_log off; default_type text/plain; return 200 "ok\n"; }

  location = / {
    types { }
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "no-cache";
    try_files /install.sh =404;
  }

  location / { return 404; }
}
